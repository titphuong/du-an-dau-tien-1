<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trang cá nhân của tôi</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
      transition: background 0.5s ease;
      padding: 20px;
    }
    .card {
      background: rgba(255, 255, 255, 0.95);
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.2);
      text-align: center;
      max-width: 360px;
      width: 100%;
    }
    .avatar {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: #2a5298;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      margin: 0 auto 15px;
      font-weight: bold;
    }
    h2 { color: #333; margin-bottom: 5px; }
    p.sub { color: #666; font-size: 14px; margin-bottom: 20px; }
    .btn {
      display: block;
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: none;
      border-radius: 10px;
      background: #2a5298;
      color: white;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: 0.2s;
    }
    .btn:hover { background: #1e3c72; transform: translateY(-2px); }
  </style>
</head>
<body>
  <div class="card">
    <div class="avatar">⚡</div>
    <h2>Xin chào!</h2>
    <p class="sub">Ứng dụng web đầu tiên được tạo với AI & GitHub</p>
    <button class="btn" onclick="doiMauNen()">🎨 Đổi màu nền</button>
  </div>
  <script>
    const danhSachMau = [
      'linear-gradient(135deg, #1e3c72 0%, #2a5298 100%)',
      'linear-gradient(135deg, #11998e 0%, #38ef7d 100%)',
      'linear-gradient(135deg, #ff416c 0%, #ff4b2b 100%)',
      'linear-gradient(135deg, #8a2387 0%, #e94057 50%, #f27121 100%)'
    ];
    let viTri = 0;
    function doiMauNen() {
      viTri = (viTri + 1) % danhSachMau.length;
      document.body.style.background = danhSachMau[viTri];
    }
  </script>
</body>
</html>
